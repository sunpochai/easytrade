services:
  - type: web
    name: easytrade
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m unittest"
    startCommand: "python bot.py --host 0.0.0.0 --source api"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TWELVE_DATA_API_KEY
        sync: false
